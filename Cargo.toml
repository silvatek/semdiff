[package]
name = "semdiff"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Semantic diff command-line utility"
autotests = false

[[test]]
name = "semdiff"
path = "tests/lib.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
